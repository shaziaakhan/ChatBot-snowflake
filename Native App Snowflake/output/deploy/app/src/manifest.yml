# version identifier
manifest_version: 1

version:
  name: V1
  label: Version One
  comment: First version of the TEST_APP_PACKAGE

# artifacts that are distributed from this version of the package
artifacts:
  setup_script: scripts/setup.sql
  default_streamlit: app_instance_schema.streamlit
  extension_code: true

# runtime configuration for this version
configuration:
  log_level: debug
  trace_level: off

references:
  - sales_table:
      label: "Sales Table"
      description: "Reference to SALES data"
      privileges:
        - SELECT
      object_type: Table
      multi_valued: false
      register_callback: app_instance_schema.update_reference

  - returns_table:
      label: "Returns Table"
      description: "Reference to RETURNS data"
      privileges:
        - SELECT
      object_type: Table
      multi_valued: false
      register_callback: app_instance_schema.update_reference

  - representatives_table:
      label: "Representatives Table"
      description: "Reference to REPRESENTATIVES data"
      privileges:
        - SELECT
      object_type: Table
      multi_valued: false
      register_callback: app_instance_schema.update_reference
